<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>James Slone - Portfolio</title>
    <link rel="icon" href="images/favicon.ico" type="icon/x-icon">
    <!-- links -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <meta name="description"
        content="Discover the portfolio of James Slone – a creative video editor, photographer, and designer. See standout projects and learn how storytelling drives his visual work.">
</head>


<special-google-analytics></special-google-analytics>


<body>
    <!-- Navigation -->
    <special-header></special-header>


    <!-- Hero Section -->

    <header>
        <div class="hero-banner">
            <video autoplay muted loop playsinline class="hero-video">
                <source src="videos-files/Hero-Banner.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

            <!-- Text Overlay -->
            <!-- position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center -->

            <div class="custom-container">
                <h1 class="text-primary display-5">Your Story Starts Here</h1>
                <p class="text-light">Creating stories through motion, light, and design.</p>
                <a href="#recent-projects" class="btn btn-primary mb-5">My Projects</a>
            </div>
        </div>
    </header>

    <section class="text-center">

        <div class="mt-3 mb-3">
            <h2 class="text-primary display-6">What is a James Slone?</h2>
        </div>
        <div class="video-wrapper-primary">
            <iframe class="player  ratio-9-16" src="https://www.youtube.com/embed/P7x0dCDHdek" loading="lazy"
                title="Meet James: Professional Video Editor"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

    </section>

    <!-- Main Content -->

    <main class="container py-5" id="recent-projects">
        <section class="recent-projects" aria-labelledby="recent-projects-title">
            <h2 class="text-primary text-center text-md-start mb-4" id="recent-projects-title">
                Recent Projects
            </h2>

            <div class="row g-4">
                <div class="col-md-4">
                    <a href="./videos" class="text-decoration-none h-100 d-block">
                        <article class="project-card h-100">
                            <img src="images/videos/levi-zadoff.jpg" loading="lazy"
                                alt="Levi Zadoff Music Video Thumbnail" class="square-image">
                            <div class="px-3">
                                <h3 class="project-title text-primary">Video Production</h3>
                                <p class="project-description text-info">Every cut has a purpose.</p>
                            </div>
                        </article>
                    </a>
                </div>

                <div class="col-md-4">
                    <a href="./photos" class="text-decoration-none h-100 d-block">
                        <article class="project-card h-100">
                            <img src="images/photography/brickworld/clone-blue-bg-lg.jpg" srcset="images/photography/brickworld/clone-blue-bg-xsm.jpg 300w,
                      images/photography/brickworld/clone-blue-bg-sm.jpg 500w,
                      images/photography/brickworld/clone-blue-bg-md.jpg 800w,
                      images/photography/brickworld/clone-blue-bg-lg.jpg 1080w"
                                sizes="(max-width: 600px) 100vw, (max-width: 992px) 50vw, 33vw"
                                alt="Lego Clone Thumbnail" loading="lazy" class="square-image">
                            <div class="px-3">
                                <h3 class="project-title text-primary">Photography</h3>
                                <p class="project-description text-info">Freezing time so I can study it later.
                                </p>
                            </div>
                        </article>
                    </a>
                </div>

                <div class="col-md-4">
                    <a href="./design" class="text-decoration-none h-100 d-block">
                        <article class="project-card h-100">
                            <img src="images/graphic-design/batman-posters/lego-batman-poster-4-sm.jpg" srcset="images/graphic-design/batman-posters/lego-batman-poster-4-xsm.jpg 300w,
                      images/graphic-design/batman-posters/lego-batman-poster-4-sm.jpg 500w,
                      images/graphic-design/batman-posters/lego-batman-poster-4-md.jpg 800w,
                      images/graphic-design/batman-posters/lego-batman-poster-4-lg.jpg 1080w"
                                sizes="(max-width: 600px) 100vw, (max-width: 992px) 50vw, 33vw"
                                alt="Lego Batman Poster 4" loading="lazy" class="square-image">

                            <div class="px-3">
                                <h3 class="project-title text-primary">Graphic Design</h3>
                                <p class="project-description text-info">Designs that hold attention.</p>
                            </div>
                        </article>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <!-- Scroll to Top Button -->
    <div class="scroll-top-wrapper">
        <div class="scroll-top-btn">
            <a href="#top" role="button" title="Back to top" aria-label="Back to top">
                <img src="images/Icons/Skip-to-top.png" loading="lazy" alt="Skip to top" title="Return to top">
            </a>
        </div>
    </div>

    <!-- Footer -->
    <special-footer></special-footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="https://kit.fontawesome.com/85ea36ec96.js" crossorigin="anonymous"></script>
    <script src="js/shortcuts.js"></script>
    <script src="js/script.js"></script>
</body>

</html>
